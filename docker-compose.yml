services:
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Configura MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Configura MINIO_SECRET_KEY en .env}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    restart: unless-stopped

  backend:
    image: "${GDE_BACKEND_IMAGE:-gdd:portable}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets:
        - build_ca
    command: >
      sh -c "python backend/manage.py migrate --noinput &&
      exec gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:8000
      --timeout 600 --workers 1"
    # .env también contiene configuración local de build y herramientas; solo se inyecta runtime.
    environment: &dashboard_environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configura DJANGO_SECRET_KEY en .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Configura MINIO_ACCESS_KEY en .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Configura MINIO_SECRET_KEY en .env}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_INSECURE: ${GITLAB_INSECURE:-0}
      ORACLE_HOST: ${ORACLE_HOST:-}
      ORACLE_PORT: ${ORACLE_PORT:-}
      ORACLE_SERVICE_NAME: ${ORACLE_SERVICE_NAME:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_SCHEMA: ${ORACLE_SCHEMA:-}
      PYTHONPATH: /app
    volumes:
      - ./outputs:/app/outputs
    ports:
      - "${BACKEND_PORT:-8011}:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker: &extraction_worker
    image: "${GDE_BACKEND_IMAGE:-gdd:portable}"
    command: >
      sh -c "python backend/manage.py recover_catalog_comment_refresh &&
      python backend/manage.py reset_stuck_tasks --worker-role extraction &&
      exec celery --workdir backend -A config worker --loglevel=INFO
      --hostname extraction@%h --queues extraction,celery --concurrency 1 --max-tasks-per-child 1"
    environment:
      <<: *dashboard_environment
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    # ponytail: ten-minute drain ceiling; raise if measured task runtimes exceed it.
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD-SHELL", "celery --workdir backend -A config inspect ping --destination extraction@$$(hostname) --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker-services:
    <<: *extraction_worker
    command: >
      sh -c "python backend/manage.py reset_stuck_tasks --worker-role services &&
      exec celery --workdir backend -A config worker --loglevel=INFO
      --hostname services@%h --queues audit,reports --concurrency 1 --max-tasks-per-child 1"
    healthcheck:
      test: ["CMD-SHELL", "celery --workdir backend -A config inspect ping --destination services@$$(hostname) --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s

volumes:
  minio_data:
  redis_data:

secrets:
  build_ca:
    file: ${BUILD_CA_CERT_FILE:-.build-ca.pem.example}
